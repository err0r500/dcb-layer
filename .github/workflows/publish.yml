name: Publish

on:
  push:
    tags:
      - "dcb_layer-*"
      - "dcb_layer_ex-*"

jobs:
  publish-dcb-layer:
    if: startsWith(github.ref, 'refs/tags/dcb_layer-')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FoundationDB client
        run: |
          wget -q https://github.com/apple/foundationdb/releases/download/7.4.6/foundationdb-clients_7.4.6-1_amd64.deb
          sudo dpkg -i foundationdb-clients_7.4.6-1_amd64.deb

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Verify tag matches Cargo.toml version
        run: |
          TAG_VER="${GITHUB_REF_NAME#dcb_layer-}"
          TOML_VER=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "dcb-layer") | .version')
          echo "tag=$TAG_VER toml=$TOML_VER"
          if [ "$TAG_VER" != "$TOML_VER" ]; then
            echo "::error::tag version ($TAG_VER) != dcb-layer/Cargo.toml version ($TOML_VER)"
            exit 1
          fi

      - run: cargo publish -p dcb-layer
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

  publish-dcb-layer-ex:
    if: startsWith(github.ref, 'refs/tags/dcb_layer_ex-')
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dcb-layer-ex
    steps:
      - uses: actions/checkout@v4

      - name: Install FoundationDB client
        run: |
          wget -q https://github.com/apple/foundationdb/releases/download/7.4.6/foundationdb-clients_7.4.6-1_amd64.deb
          sudo dpkg -i foundationdb-clients_7.4.6-1_amd64.deb

      - uses: dtolnay/rust-toolchain@stable

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - uses: actions/cache@v4
        with:
          path: |
            dcb-layer-ex/deps
            dcb-layer-ex/_build
          key: elixir-${{ hashFiles('dcb-layer-ex/mix.lock') }}
          restore-keys: elixir-

      - name: Verify tag matches mix.exs version
        run: |
          TAG_VER="${GITHUB_REF_NAME#dcb_layer_ex-}"
          MIX_VER=$(grep -oP 'version:\s*"\K[^"]+' mix.exs | head -1)
          echo "tag=$TAG_VER mix=$MIX_VER"
          if [ "$TAG_VER" != "$MIX_VER" ]; then
            echo "::error::tag version ($TAG_VER) != dcb-layer-ex/mix.exs version ($MIX_VER)"
            exit 1
          fi

      - run: mix deps.get
      - run: mix hex.publish --yes
        env:
          HEX_API_KEY: ${{ secrets.HEX_API_KEY }}

name: CI

on:
  push:
  pull_request:

jobs:
  # Lockstep versions must agree across all manifests (enforced on every PR so
  # mismatches fail here, not at tag time).
  versions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify crate == NIF dep == mix version
        run: |
          CRATE_VER=$(grep -m1 '^version = ' dcb-layer/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          NIF_VER=$(grep -m1 '^dcb-layer = ' dcb-layer-ex/native/dcb_layer_nif/Cargo.toml | sed -E 's/.*"([^"]+)".*/\1/')
          MIX_VER=$(grep -m1 '@version ' dcb-layer-ex/mix.exs | sed -E 's/.*"([^"]+)".*/\1/')
          echo "crate=$CRATE_VER nif_dep=$NIF_VER mix=$MIX_VER"
          if [ "$CRATE_VER" != "$NIF_VER" ] || [ "$CRATE_VER" != "$MIX_VER" ]; then
            echo "::error::version mismatch (crate=$CRATE_VER nif_dep=$NIF_VER mix=$MIX_VER)"
            exit 1
          fi

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FoundationDB client
        run: |
          wget -q https://github.com/apple/foundationdb/releases/download/7.4.6/foundationdb-clients_7.4.6-1_amd64.deb
          sudo dpkg -i foundationdb-clients_7.4.6-1_amd64.deb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy -p dcb-layer -- -D warnings

      - run: cargo test -p dcb-layer

      - run: cargo publish -p dcb-layer --dry-run

  elixir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dcb-layer-ex
    steps:
      - uses: actions/checkout@v4

      - name: Install FoundationDB client
        run: |
          wget -q https://github.com/apple/foundationdb/releases/download/7.4.6/foundationdb-clients_7.4.6-1_amd64.deb
          sudo dpkg -i foundationdb-clients_7.4.6-1_amd64.deb

      - uses: dtolnay/rust-toolchain@stable

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - uses: actions/cache@v4
        with:
          path: |
            dcb-layer-ex/deps
            dcb-layer-ex/_build
          key: elixir-${{ hashFiles('dcb-layer-ex/mix.lock') }}
          restore-keys: elixir-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test
      # `mix hex.build` is not run here: it requires the generated
      # checksum-Elixir.Dcb.Native.exs, which only exists at release time
      # (created by `mix rustler_precompiled.download` in publish.yml).

name: CI

on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install FoundationDB client
        run: |
          wget -q https://github.com/apple/foundationdb/releases/download/7.4.6/foundationdb-clients_7.4.6-1_amd64.deb
          sudo dpkg -i foundationdb-clients_7.4.6-1_amd64.deb

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - run: cargo clippy -- -D warnings

      - run: cargo test

      - run: cargo publish --dry-run

  elixir:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dcb-layer-ex
    steps:
      - uses: actions/checkout@v4

      - name: Install FoundationDB client
        run: |
          wget -q https://github.com/apple/foundationdb/releases/download/7.4.6/foundationdb-clients_7.4.6-1_amd64.deb
          sudo dpkg -i foundationdb-clients_7.4.6-1_amd64.deb

      - uses: dtolnay/rust-toolchain@stable

      - uses: erlef/setup-beam@v1
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - uses: actions/cache@v4
        with:
          path: |
            dcb-layer-ex/deps
            dcb-layer-ex/_build
          key: elixir-${{ hashFiles('dcb-layer-ex/mix.lock') }}
          restore-keys: elixir-

      - run: mix deps.get
      - run: mix compile --warnings-as-errors
      - run: mix test
      - run: mix hex.build

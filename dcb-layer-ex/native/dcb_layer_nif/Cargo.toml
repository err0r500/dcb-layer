[package]
name = "dcb_layer_nif"
version = "0.1.0"
edition = "2021"

[lib]
name = "dcb_layer_nif"
crate-type = ["cdylib"]

[features]
default = ["fdb-7_4"]
fdb-7_3 = ["foundationdb/fdb-7_3"]
fdb-7_4 = ["foundationdb/fdb-7_4"]

[dependencies]
dcb-layer = "0.2.2"
foundationdb = { version = "0.10", features = ["embedded-fdb-include"] }
once_cell = "1.21.4"
# nif_version_2_15 must be enabled explicitly: Rustler >= 0.30 activates no NIF
# version by default, and the precompiled build (cross, no mix) needs it set.
rustler = { version = "0.35", features = ["nif_version_2_15"] }
tokio = { version = "1", features = ["full"] }

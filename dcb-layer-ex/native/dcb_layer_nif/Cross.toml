# Used by `cross` (via philss/rustler-precompiled-action) when building the NIF
# for Linux targets in CI. The foundationdb-rs crate links `libfdb_c`, so the
# FoundationDB client library must be present in the build container for the
# target architecture. Not shipped to Hex (not in mix.exs package files).
#
# NOTE: verify the client .deb asset names for FDB_VERSION exist on the
# FoundationDB releases page before bumping the version.

[target.x86_64-unknown-linux-gnu]
pre-build = [
    "apt-get update && apt-get install -y --no-install-recommends wget ca-certificates",
    "wget -q https://github.com/apple/foundationdb/releases/download/7.4.6/foundationdb-clients_7.4.6-1_amd64.deb -O /tmp/fdb.deb",
    "dpkg -i /tmp/fdb.deb || apt-get install -yf",
]

[target.aarch64-unknown-linux-gnu]
pre-build = [
    "apt-get update && apt-get install -y --no-install-recommends wget ca-certificates",
    "wget -q https://github.com/apple/foundationdb/releases/download/7.4.6/foundationdb-clients_7.4.6-1_aarch64.deb -O /tmp/fdb.deb",
    "dpkg -i /tmp/fdb.deb || apt-get install -yf",
]
